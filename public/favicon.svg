<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#0A0A09" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#E2B26A" />
      <stop offset="100%" stop-color="#AC7A32" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Circular Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Concentric Hairline Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#E2B26A" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2 3" />

  <!-- Botanical Laurel / Immortelle Sprig Micro-flourish at Top & Bottom -->
  <path d="M64 16 L65.5 20 L64 21.5 L62.5 20 Z" fill="#E2B26A" />
  <circle cx="64" cy="111" r="1.5" fill="#E2B26A" />

  <!-- Maison Verenne Interlocking Luxury Monogram 'V' -->
  <g fill="url(#goldGrad)">
    <!-- Main Left Stem: Heavy classical Roman serif taper -->
    <path d="M40 37 L50 37 L64 89 L57 89 Z" />
    <!-- Fine Right Hairline Stem -->
    <path d="M87 37 L89.5 37 L65 91 L62.5 91 Z" />
    <!-- Top Left Serif Bracket -->
    <path d="M36 36 L54 36 L54 38.5 L46 38.5 L40 38.5 Z" />
    <!-- Top Right Serif Bracket -->
    <path d="M82 36 L93 36 L93 38.5 L88 38.5 L84 38.5 Z" />
    <!-- Interlocking Center Botanical Diamond / Pipette Core -->
    <polygon points="64,52 68,58 64,64 60,58" fill="#FCEFD2" />
  </g>
</svg>